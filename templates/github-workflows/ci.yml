# Python CI gate: ruff (lint + format), mypy (types), pip-audit (dependency CVEs).
# Python projects only. For JS/TS use ci-node.yml.
# Copy to .github/workflows/ci.yml. Existing codebase? See templates/README.md
# "Adopting on an existing repo" before making this a required check.
#
# Actions are pinned to full commit SHAs because tags can be moved (the trivy-action
# compromise of March 2026). Bump with Dependabot (github-actions ecosystem) or pinact.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"   # match your project
      - run: pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .   # existing codebase: run `ruff format .` once, in its own PR

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install project (mypy needs the deps to type-check imports)
        run: |
          python -m pip install --upgrade pip
          # Install as a package only when pyproject.toml declares one ([project] table).
          # A pyproject.toml that only holds tool settings (ruff/mypy) can't be pip-installed.
          if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            pip install -e '.[dev]' || pip install -e .
          fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install mypy==2.4.0
      - run: mypy .

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install project (so pip-audit can resolve installed deps)
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            pip install -e '.[dev]' || pip install -e .
          fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Poetry/uv projects: `poetry export` / `uv export` to requirements.txt first.
          pip install pip-audit==2.10.1
      # No --strict: it fails on your own (unpublished) project because it isn't on PyPI.
      # Known vulnerabilities still fail the job.
      - run: pip-audit
