# Local enforcement: runs ruff, mypy, and basic hygiene checks before each commit.
# Install once: `pip install pre-commit && pre-commit install`
# First-time sweep: `pre-commit run --all-files`

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4    # bump via `pre-commit autoupdate`
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          # add your project's typed deps so mypy sees them:
          # - pydantic
          # - sqlalchemy
          # - types-requests
        args: [--ignore-missing-imports]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks   # blocks commits containing secrets

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key       # security: catches committed private keys
      - id: check-added-large-files
