# Local enforcement: runs ruff, mypy, gitleaks, and basic hygiene checks before each commit.
# Install once: `pip install pre-commit && pre-commit install`
# First-time sweep: `pre-commit run --all-files`
#   On an existing codebase this sweep will rewrite files (ruff --fix, ruff-format,
#   whitespace fixers). Run it on its own branch/commit so the reformat is reviewable
#   and separate from real changes. See templates/README.md "Adopting on an existing repo".
#
# Revs are frozen to commit SHAs (tags can be moved; see the trivy-action compromise of
# March 2026). Update with: `pre-commit autoupdate --freeze`

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e  # frozen: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b  # frozen: v2.4.0
    hooks:
      - id: mypy
        # Add your project's typed deps so mypy can see them, e.g.
        #   additional_dependencies: [pydantic, sqlalchemy, types-requests]
        # Keep this a list ([] when empty); an empty key with no value fails validation.
        additional_dependencies: []
        args: [--ignore-missing-imports]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks   # blocks commits containing secrets

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key       # security: catches committed private keys
      - id: check-added-large-files
